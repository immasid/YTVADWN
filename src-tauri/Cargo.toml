[package]
name = "pulsestream"
version = "0.1.0"
description = "PulseStream - Authentic Zero-Transcoding YouTube Media Downloader"
authors = ["PulseStream Team"]
edition = "2021"

[lib]
name = "pulsestream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "stream"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors"] }
dirs = "6.0"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
